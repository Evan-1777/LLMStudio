<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="theme-color"
      content="#f5f5f7"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#111113"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <title>LLMStudio</title>
    <!--
      Applies the gateway-confirmed theme before the app mounts so the first paint
      matches the authoritative preference. Mirrors readThemeHint()/CONNECTION_STORAGE_KEY
      in src/core/settings.ts, which also owns the authoritative values.
    -->
    <script>
      (function () {
        try {
          var storage = window.localStorage;
          var connection = JSON.parse(
            storage.getItem('llmstudio.connection.v1') || 'null',
          );
          var gateway =
            connection && typeof connection.gatewayBaseUrl === 'string'
              ? connection.gatewayBaseUrl
              : '/';
          var desktop = window.__LLMSTUDIO_DESKTOP__;
          var isDesktop = Boolean(
            desktop &&
              typeof desktop.apiBaseUrl === 'string' &&
              desktop.apiBaseUrl.trim() &&
              typeof desktop.sessionToken === 'string' &&
              desktop.sessionToken.trim(),
          );
          var hint = JSON.parse(
            storage.getItem(
              'llmstudio.themeHint.v1::' + (isDesktop ? 'desktop' : gateway),
            ) || 'null',
          );
          if (!hint) return;
          var mode = hint.themeMode;
          var dark =
            mode === 'dark' ||
            (mode !== 'light' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.dataset.theme = dark ? 'dark' : 'light';
          if (typeof hint.seedColorValue === 'number') {
            var seed = hint.seedColorValue >>> 0;
            var presets = {
              4278221567: ['#007AFF', '#409CFF'],
              4282343312: ['#3F5F90', '#6B8EC4'],
              4281166415: ['#2D6A4F', '#52B788'],
              4284960932: ['#6750A4', '#9A82DB'],
              4288430625: ['#9C4221', '#E07A5F'],
              4282865001: ['#475569', '#94A3B8'],
            };
            var preset = presets[seed];
            var accent = preset
              ? preset[dark ? 1 : 0]
              : '#' +
                (seed & 0xffffff).toString(16).padStart(6, '0');
            root.style.setProperty('--accent', accent);
          }
          var fonts = { system: 1, sans: 1, serif: 1, kai: 1, mono: 1 };
          if (typeof hint.fontFamily === 'string' && fonts[hint.fontFamily]) {
            root.dataset.fontFamily = hint.fontFamily;
          }
          if (
            typeof hint.fontSize === 'number' &&
            Number.isInteger(hint.fontSize) &&
            hint.fontSize >= 12 &&
            hint.fontSize <= 22
          ) {
            root.style.setProperty('--font-size-base', hint.fontSize + 'px');
          }
        } catch (error) {
          /* first paint falls back to the default theme */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
