name: Build Windows Desktop Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional release version (defaults to backend/mygo.json version)
        required: false
        default: ""
        type: string
      publish_release:
        description: Create or update GitHub Release desktop-v<version>
        required: false
        default: true
        type: boolean
      draft:
        description: Mark GitHub Release as draft
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-windows-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install NSIS and zip
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis zip

      - name: Frontend checks and build
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Backend tests
        working-directory: backend
        run: go test -race ./...

      - name: Resolve and apply desktop version
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="$(node -e '
            const fs = require("fs");
            const path = "backend/mygo.json";
            const cfg = JSON.parse(fs.readFileSync(path, "utf8"));
            const override = (process.env.INPUT_VERSION || "").trim().replace(/^desktop-v/i, "").replace(/^v/i, "");
            if (override) {
              if (!/^[0-9A-Za-z._-]+$/.test(override)) {
                console.error("Invalid version:", override);
                process.exit(1);
              }
              cfg.version = override;
              fs.writeFileSync(path, JSON.stringify(cfg, null, 2) + "\n");
            }
            if (!cfg.version || !String(cfg.version).trim()) {
              console.error("Missing version in backend/mygo.json");
              process.exit(1);
            }
            process.stdout.write(String(cfg.version).trim());
          ')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build Windows amd64 executable and NSIS installer
        working-directory: backend
        run: |
          go run github.com/egoist/mygo/cmd/mygo@v0.7.4 build -platform windows/amd64 -skip-build-command

      - name: Package portable archive and SHA256SUMS
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          OUT_DIR="build/desktop/windows-amd64"
          SETUP_FILE="${OUT_DIR}/llmstudio-setup-${VERSION}-amd64.exe"
          PORTABLE_ZIP="llmstudio-portable-${VERSION}-windows-amd64.zip"

          test -f "${OUT_DIR}/LLMStudio.exe"
          test -f "${SETUP_FILE}"

          STAGE_DIR="$(mktemp -d)"
          trap 'rm -rf "$STAGE_DIR"' EXIT
          cp "${OUT_DIR}/LLMStudio.exe" "${STAGE_DIR}/LLMStudio.exe"
          : > "${STAGE_DIR}/.portable"
          (cd "${STAGE_DIR}" && zip -9 "${GITHUB_WORKSPACE}/${OUT_DIR}/${PORTABLE_ZIP}" LLMStudio.exe .portable)

          (
            cd "${OUT_DIR}"
            sha256sum "llmstudio-setup-${VERSION}-amd64.exe" "${PORTABLE_ZIP}" > SHA256SUMS.txt
          )

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llmstudio-desktop-windows-amd64-${{ steps.meta.outputs.version }}
          if-no-files-found: error
          path: |
            build/desktop/windows-amd64/llmstudio-setup-${{ steps.meta.outputs.version }}-amd64.exe
            build/desktop/windows-amd64/llmstudio-portable-${{ steps.meta.outputs.version }}-windows-amd64.zip
            build/desktop/windows-amd64/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          DRAFT: ${{ inputs.draft }}
        run: |
          TAG="desktop-v${VERSION}"
          OUT_DIR="build/desktop/windows-amd64"
          ASSETS=(
            "${OUT_DIR}/llmstudio-setup-${VERSION}-amd64.exe"
            "${OUT_DIR}/llmstudio-portable-${VERSION}-windows-amd64.zip"
            "${OUT_DIR}/SHA256SUMS.txt"
          )

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${ASSETS[@]}" --clobber
          else
            CREATE_FLAGS=(--title "LLMStudio Desktop v${VERSION}" --notes "Windows 11 x64 installer and portable release.")
            if [ "${DRAFT}" = "true" ]; then
              CREATE_FLAGS+=(--draft)
            fi
            gh release create "${TAG}" "${ASSETS[@]}" "${CREATE_FLAGS[@]}"
          fi
